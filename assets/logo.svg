<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Glow & Shadows -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="doc-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#001833" flood-opacity="0.45"/>
    </filter>

    <!-- Gradients for VS Code Ribbon Elements -->
    <linearGradient id="vscode-ribbon-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E639C"/>
      <stop offset="100%" stop-color="#004680"/>
    </linearGradient>

    <linearGradient id="vscode-ribbon-left" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#1F9CF0"/>
      <stop offset="100%" stop-color="#007ACC"/>
    </linearGradient>

    <linearGradient id="vscode-ribbon-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40B6FF"/>
      <stop offset="60%" stop-color="#007ACC"/>
      <stop offset="100%" stop-color="#005A9E"/>
    </linearGradient>

    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E1E"/>
      <stop offset="100%" stop-color="#121316"/>
    </linearGradient>

    <linearGradient id="doc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F4F8"/>
    </linearGradient>

    <linearGradient id="fold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D0DBE5"/>
      <stop offset="100%" stop-color="#A2B4C7"/>
    </linearGradient>
  </defs>

  <!-- Canvas Tile (Rounded App Icon Surface) -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#2D3139" stroke-width="3"/>

  <!-- Subtle Blueprint Grid Accent in Background -->
  <g opacity="0.07" stroke="#007ACC" stroke-width="1.5">
    <line x1="80" y1="0" x2="80" y2="512"/>
    <line x1="160" y1="0" x2="160" y2="512"/>
    <line x1="240" y1="0" x2="240" y2="512"/>
    <line x1="320" y1="0" x2="320" y2="512"/>
    <line x1="400" y1="0" x2="400" y2="512"/>
    <line x1="0" y1="80" x2="512" y2="80"/>
    <line x1="0" y1="160" x2="512" y2="160"/>
    <line x1="0" y1="240" x2="512" y2="240"/>
    <line x1="0" y1="320" x2="512" y2="320"/>
    <line x1="0" y1="400" x2="512" y2="400"/>
  </g>

  <!-- ==================== MAIN EMBLEM GROUP ==================== -->
  <g filter="url(#drop-shadow)">

    <!-- VS Code Style Left Ribbon - Back Wing -->
    <path d="M 126 156 L 366 312 L 302 366 L 94 212 Z" 
          fill="url(#vscode-ribbon-back)" opacity="0.9"/>

    <!-- The Document Sheet (Layered into the VS Code Ribbon) -->
    <g filter="url(#doc-shadow)">
      <!-- Main Paper Body with Folded Corner -->
      <!-- Document outline: (140, 90) -> (310, 90) -> (360, 140) -> (360, 420) -> (140, 420) -->
      <path d="M 148 96 
               L 306 96 
               L 364 154 
               L 364 416 
               Q 364 424 356 424 
               L 148 424 
               Q 140 424 140 416 
               L 140 104 
               Q 140 96 148 96 Z" 
            fill="url(#doc-grad)" stroke="#CAD5E0" stroke-width="2"/>

      <!-- Document Folded Corner (Top Right) -->
      <path d="M 306 96 L 306 148 Q 306 154 312 154 L 364 154 Z" 
            fill="url(#fold-grad)"/>

      <!-- Document Title & Header Lines -->
      <!-- Mini "VS DOCS" Typography inside document -->
      <text x="164" y="142" 
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Display', sans-serif" 
            font-size="28" 
            font-weight="900" 
            letter-spacing="1.5" 
            fill="#0E2A47">VS DOCS</text>

      <!-- Colored Office Format Accent Badges on Document -->
      <!-- Word Blue Pill -->
      <rect x="164" y="160" width="46" height="18" rx="4" fill="#0078D4"/>
      <text x="171" y="173" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">DOCX</text>

      <!-- Excel Green Pill -->
      <rect x="216" y="160" width="44" height="18" rx="4" fill="#107C41"/>
      <text x="224" y="173" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">XLSX</text>

      <!-- PDF Red Pill -->
      <rect x="266" y="160" width="38" height="18" rx="4" fill="#D83B01"/>
      <text x="274" y="173" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">PDF</text>

      <!-- Document Stylized Text Lines (Paragraphs) -->
      <g stroke-linecap="round">
        <!-- Paragraph 1 -->
        <line x1="164" y1="202" x2="336" y2="202" stroke="#2B579A" stroke-width="5"/>
        <line x1="164" y1="218" x2="310" y2="218" stroke="#7A8B9E" stroke-width="4"/>
        <line x1="164" y1="234" x2="326" y2="234" stroke="#7A8B9E" stroke-width="4"/>
        <line x1="164" y1="250" x2="260" y2="250" stroke="#7A8B9E" stroke-width="4"/>

        <!-- Mini Table Grid Visualization inside document -->
        <rect x="164" y="274" width="174" height="70" rx="4" fill="#F4F7FA" stroke="#CCD7E2" stroke-width="1.5"/>
        <line x1="164" y1="294" x2="338" y2="294" stroke="#107C41" stroke-width="2.5"/>
        <line x1="222" y1="274" x2="222" y2="344" stroke="#CCD7E2" stroke-width="1.5"/>
        <line x1="280" y1="274" x2="280" y2="344" stroke="#CCD7E2" stroke-width="1.5"/>
        <line x1="164" y1="318" x2="338" y2="318" stroke="#E2E9F0" stroke-width="1.5"/>

        <!-- Paragraph 2 -->
        <line x1="164" y1="368" x2="328" y2="368" stroke="#7A8B9E" stroke-width="4"/>
        <line x1="164" y1="384" x2="300" y2="384" stroke="#7A8B9E" stroke-width="4"/>
        <line x1="164" y1="400" x2="240" y2="400" stroke="#7A8B9E" stroke-width="4"/>
      </g>
    </g>

    <!-- ==================== VS CODE ICONIC RIBBON OVERLAYS ==================== -->
    <!-- Left Ribbon Cross Wing (Lower Loop) -->
    <path d="M 94 300 
             L 302 146 
             L 366 200 
             L 126 356 
             Q 102 342 94 300 Z" 
          fill="url(#vscode-ribbon-left)" opacity="0.95"/>

    <!-- Right Outer Chevron / Bevel of the VS Code Logo (Distinctive > Bracket) -->
    <path d="M 364 148 
             L 446 226 
             Q 456 236 456 256 
             Q 456 276 446 286 
             L 364 364 
             L 326 332 
             L 404 256 
             L 326 180 Z" 
          fill="url(#vscode-ribbon-front)"/>

    <!-- Front Crossing Ribbon (Completes VS Code Origami Loop) -->
    <path d="M 94 300 
             L 126 356 
             L 364 364 
             L 404 256 
             L 364 148 
             L 326 180 
             L 352 256 
             L 302 308 Z" 
          fill="url(#vscode-ribbon-front)" opacity="0.9"/>
  </g>

  <!-- Glowing Accent Indicator (Top Left Glass Highlight) -->
  <circle cx="96" cy="96" r="6" fill="#007ACC" opacity="0.6"/>
  <circle cx="96" cy="96" r="2" fill="#FFFFFF" opacity="0.9"/>
</svg>

